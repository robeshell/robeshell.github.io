  <path d="M210 465h72l30-105 43 240 38-160 28 25h68l28-89 32 178 43-94 35 0 31 65 34-132 36 179 38-107 55 0 34 48 40-89 32 141h86" fill="none" stroke="#f2d26f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
